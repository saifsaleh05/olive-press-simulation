# Olive press simulation settings.
# Format: key = value, '#' starts a comment. Anything left out keeps the
# built-in default (see common/config.c). Unknown keys are rejected.

seed            = 2026
num_batches     = 10
queue_capacity  = 4

# batch generation (kg / fractions)
batch_mass_min      = 400
batch_mass_max      = 600
impurity_min        = 0.02
impurity_max        = 0.06
oil_potential_min   = 0.16
oil_potential_max   = 0.22
water_fraction_min  = 0.45
water_fraction_max  = 0.55
extraction_eff      = 0.88

# environment
ambient_temp    = 22.0
tick            = 0.1        # seconds between telemetry samples

# fault handling: clear over-temperature / over-pressure faults once the
# machine cools below limit * recover_ratio
auto_recover    = 1
recover_ratio   = 0.97

# per machine: duration in seconds, heat in C/s at full load,
# cool as a Newton cooling constant (1/s), limits checked by QC
reception.duration_min   = 0.6
reception.duration_max   = 0.9
reception.heat_rate      = 0.20
reception.cool_rate      = 0.10
reception.max_temp       = 45
reception.base_pressure  = 1.0
reception.max_pressure   = 2.0

cleaning.duration_min    = 0.8
cleaning.duration_max    = 1.2
cleaning.heat_rate       = 0.30
cleaning.cool_rate       = 0.12
cleaning.max_temp        = 45
cleaning.base_pressure   = 1.2
cleaning.max_pressure    = 2.5
cleaning.debris_removal  = 0.7      # air blower takes most of the leaves

washing.duration_min     = 1.0
washing.duration_max     = 1.4
washing.heat_rate        = 0.15
washing.cool_rate        = 0.20
washing.max_temp         = 40
washing.base_pressure    = 2.0
washing.max_pressure     = 4.0
washing.debris_removal   = 1.0      # whatever soil is left

crushing.duration_min    = 1.4
crushing.duration_max    = 2.0
crushing.heat_rate       = 1.60
crushing.cool_rate       = 0.15
crushing.max_temp        = 38
crushing.base_pressure   = 3.0
crushing.max_pressure    = 6.0

malaxation.duration_min  = 2.4
malaxation.duration_max  = 3.2
malaxation.heat_rate     = 0.55
malaxation.cool_rate     = 0.20
malaxation.max_temp      = 27       # cold extraction limit
malaxation.base_pressure = 1.0
malaxation.max_pressure  = 2.0

separation.duration_min  = 1.8
separation.duration_max  = 2.6
separation.heat_rate     = 0.90
separation.cool_rate     = 0.15
separation.max_temp      = 35
separation.base_pressure = 4.5
separation.max_pressure  = 8.0
